# hypridle: lock and blank the screen when idle.
# Fullscreen windows (videos, games) block this; see rules.lua.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = ~/.config/hypr/scripts/dpms.sh on
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screens off, back on with any input
listener {
    timeout = 660
    on-timeout = ~/.config/hypr/scripts/dpms.sh off
    on-resume = ~/.config/hypr/scripts/dpms.sh on
}

# 30 min: suspend. Uncomment if you want it.
