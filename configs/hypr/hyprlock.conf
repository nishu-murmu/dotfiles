# hyprlock: Gruvbox lock screen, same wallpaper as betterlockscreen and SDDM.

$font = Hack Nerd Font
$fg = rgb(ebdbb2)
$bg = rgba(282828cc)
$yellow = rgb(fabd2f)
$orange = rgb(fe8019)
$red = rgb(fb4934)

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/i3/Wallpapers/Arch-Black.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font Bold
    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $yellow
    font_size = 20
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $yellow
    inner_color = $bg
    font_color = $fg
    check_color = $orange
    fail_color = $red
    fade_on_empty = false
    placeholder_text = <span foreground="##928374">  $USER</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 10
    position = 0, -60
    halign = center
    valign = center
}
